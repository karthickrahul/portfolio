<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karthickk Rahul Srinivasan · Industrial Engineer</title>
<meta name="description" content="Industrial Engineering M.Sc. student at VŠB – TU Ostrava. Quality, SPC, lean and data tools for manufacturing.">
<meta property="og:type" content="website">
<meta property="og:title" content="Karthickk Rahul Srinivasan · Industrial Engineer">
<meta property="og:description" content="Quality, SPC, lean and data tools for manufacturing. M.Sc. Industrial Engineering, VŠB – TU Ostrava.">
<meta name="theme-color" content="#f5f6f4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231c2430'/%3E%3Ctext x='32' y='44' font-family='Arial,Helvetica' font-weight='700' font-size='30' text-anchor='middle' fill='%23ffffff'%3EK%3Ctspan fill='%23ff5a4f'%3ES%3C/tspan%3E%3C/text%3E%3C/svg%3E">

<script src="content.js"></script>
<style>
/* Layout: a clean engineering document — light drafting-paper ground, CV-order sections, one framed technical drawing as the only animated moment. */
:root{
  --paper:#f5f6f4;      /* page: cool drafting paper */
  --sheet:#ffffff;      /* cards */
  --ink:#1c2430;        /* text: graphite blue */
  --steel:#5a6472;      /* secondary text */
  --rule:#dfe2e4;       /* hairlines */
  --grid:#e9ebec;       /* paper grid */
  --signal:#c8261d;     /* accent: andon red, used sparingly */
  --ok:#2f8a55;
  --amber:#a8741c;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sz-head:1; --sz-sec:1; --sz-card:1; --sz-num:1; --sz-text:1;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:calc(16px * var(--sz-text));line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-family:var(--f-display);font-stretch:108%;letter-spacing:-.01em}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}

/* NAV */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
nav.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:15px}
.brand b{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;background:var(--ink);color:#fff;font-family:var(--f-display);font-size:14px;letter-spacing:.02em}
.brand b span{color:#ff6b61}
.navlinks{display:flex;gap:28px;list-style:none;margin:0;padding:0}
.navlinks a{text-decoration:none;font-size:14px;color:var(--steel)}
.navlinks a:hover{color:var(--ink)}
.navcta{font-size:14px;font-weight:600;text-decoration:none;padding:8px 14px;border:1px solid var(--ink);border-radius:6px}
.navcta:hover{background:var(--ink);color:#fff}
@media (max-width:860px){.navlinks{display:none}}

/* HERO */
.hero{border-bottom:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px;border-bottom:1px solid var(--rule)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:56px;align-items:center;padding-block:72px 64px}
.hero-copy{display:flex;flex-direction:column;gap:20px;min-width:0}
.badge{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:5px 12px 5px 10px;font-size:13px;font-weight:500}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.hero h1{font-size:calc(clamp(40px,5.4vw,66px) * var(--sz-head));line-height:1.02;font-weight:750;font-stretch:112%}
.role{font-size:calc(20px * var(--sz-text));font-weight:500;margin:0}
.focus{margin:0;font-size:calc(17px * var(--sz-text));color:var(--steel)}
.focus #swap{color:var(--signal);font-weight:600;display:inline-block;transition:opacity .35s,transform .35s}
.focus #swap.out{opacity:0;transform:translateY(6px)}
.lede{margin:0;max-width:56ch;color:var(--steel);font-size:calc(17px * var(--sz-text))}
.lede strong{color:var(--ink);font-weight:600}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:6px;font-weight:600;font-size:14.5px;text-decoration:none;border:1px solid var(--ink);color:var(--ink);background:transparent;transition:background .2s,color .2s,transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2b3646}
.btn.ghost{border-color:var(--rule);background:var(--sheet)}
.btn.ghost:hover{border-color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--steel);margin-top:4px}
.meta span{display:inline-flex;align-items:center;gap:7px}
.meta svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* DRAWING FRAME */
.drawing{background:var(--sheet);border:1.5px solid var(--ink);box-shadow:0 20px 50px -30px rgba(28,36,48,.45);display:flex;flex-direction:column;min-width:0}
.drawing .canvas-box{position:relative;aspect-ratio:1/1;max-width:100%;margin:10px;border:1px solid var(--rule)}
#hero-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.corner{position:absolute;width:12px;height:12px;border-color:var(--ink);border-style:solid}
.corner.tl{top:-1px;left:-1px;border-width:2px 0 0 2px}.corner.tr{top:-1px;right:-1px;border-width:2px 2px 0 0}
.corner.bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px}.corner.br{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.titleblock{display:grid;grid-template-columns:1.4fr 1fr 1fr;border-top:1.5px solid var(--ink);font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.titleblock div{padding:7px 10px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:1px;min-width:0}
.titleblock div:last-child{border-right:0}
.titleblock small{font-size:9.5px;color:var(--steel)}
.titleblock b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-family:var(--f-mono);font-size:10.5px;color:var(--steel);text-align:right;padding:0 10px 8px;letter-spacing:.04em}

/* STATS */
.stats-band{background:var(--sheet);border-top:1px solid var(--rule)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.stat:first-child{padding-left:0}
.hero .wrap.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding-block:0}
.stat{padding:26px 28px;display:flex;gap:16px;align-items:baseline;min-width:0}
.stat+.stat{border-left:1px solid var(--rule)}
.stat .n{font-family:var(--f-display);font-stretch:112%;font-weight:750;font-size:calc(40px * var(--sz-num));line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .n em{font-style:normal;color:var(--signal);font-size:.55em;margin-left:3px}
.stat p{margin:0;font-size:calc(14px * var(--sz-text));color:var(--steel)}
@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr;gap:40px;padding-block:44px}
  .drawing{max-width:460px;width:100%;justify-self:center}
  .stats{grid-template-columns:1fr}.stat+.stat{border-left:0;border-top:1px solid var(--rule)}.stat,.stat:first-child{padding:18px 0}.hero .wrap.stats{grid-template-columns:1fr}
}

/* SECTIONS */
section.block{padding-block:88px;border-bottom:1px solid var(--rule)}
section.block.alt{background:var(--sheet)}
.sec-head{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;margin-bottom:40px;align-items:baseline}
.sec-head .mono{color:var(--signal)}
.sec-head h2{font-size:calc(clamp(30px,3.6vw,42px) * var(--sz-sec));font-weight:700;line-height:1.1}
.sec-body{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px}
.sec-body > :first-child{min-width:0}
@media (max-width:860px){.sec-head,.sec-body{grid-template-columns:1fr;gap:14px}.sec-body .side{display:none}}

/* ABOUT */
.portrait{width:100%;max-width:220px;aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:var(--ink);display:grid;place-items:center;position:relative}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.portrait .mark{font-family:var(--f-display);font-stretch:120%;font-weight:800;font-size:64px;color:#fff;letter-spacing:.02em}
.portrait .mark span{color:#ff6b61}
.about-copy{display:flex;flex-direction:column;gap:18px;min-width:0}
.about-copy p{margin:0;max-width:64ch;font-size:calc(17px * var(--sz-text));color:#36404d}
.about-copy p strong{color:var(--ink);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);margin-top:8px;overflow:hidden}
.fact{padding:14px 18px;display:flex;flex-direction:column;gap:2px;min-width:0;border-bottom:1px solid var(--rule)}
.fact:nth-child(odd){border-right:1px solid var(--rule)}
.fact:nth-last-child(-n+2){border-bottom:0}
.fact span:last-child{font-size:calc(15px * var(--sz-text));font-weight:500}
@media (max-width:860px){.about-wrap{grid-template-columns:1fr!important}.portrait{max-width:180px}}
@media (max-width:520px){.facts{grid-template-columns:1fr}.fact:nth-child(odd){border-right:0}.fact:nth-last-child(2){border-bottom:1px solid var(--rule)}}

/* EXPERIENCE */
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.job{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;padding:26px 0;border-top:1px solid var(--rule);position:relative}
.job:last-child{border-bottom:1px solid var(--rule)}
.job .when{font-family:var(--f-mono);font-size:13px;color:var(--steel);padding-top:4px;font-variant-numeric:tabular-nums}
.job.current .when{color:var(--signal)}
.job h3{font-size:calc(21px * var(--sz-card));font-weight:650;line-height:1.25}
.job .org{font-weight:500;color:#36404d;margin-top:2px;font-size:calc(15.5px * var(--sz-text))}
.job p{margin:8px 0 0;color:var(--steel);max-width:68ch;font-size:calc(15.5px * var(--sz-text))}
@media (max-width:860px){.job{grid-template-columns:1fr;gap:6px}}

/* PROJECTS */
.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.proj{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:border-color .2s,box-shadow .2s,transform .2s}
.proj:hover{border-color:#c4c9ce;box-shadow:0 14px 34px -24px rgba(28,36,48,.5);transform:translateY(-2px)}
.proj .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.proj h3{font-size:calc(22px * var(--sz-card));font-weight:650;line-height:1.2}
.proj p{margin:0;color:var(--steel);font-size:calc(15px * var(--sz-text))}
.proj.feature{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:36px;padding:34px;border-color:var(--ink);border-width:1.5px}
.proj.feature h3{font-size:calc(clamp(26px,3vw,34px) * var(--sz-card))}
.proj.feature .main{display:flex;flex-direction:column;gap:14px;min-width:0}
.pill{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--rule);border-radius:999px;color:var(--steel);white-space:nowrap}
.pill.live{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);background:color-mix(in srgb,var(--ok) 7%,transparent)}
.pill.wip{border-color:color-mix(in srgb,var(--amber) 45%,transparent);color:var(--amber);background:color-mix(in srgb,var(--amber) 7%,transparent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tags span{font-size:12.5px;padding:3px 9px;border-radius:4px;background:#eef0f1;color:#3d4753}
.links{display:flex;flex-wrap:wrap;gap:16px}
.links a{font-size:14.5px;font-weight:600;text-decoration:none;color:var(--ink);border-bottom:1.5px solid var(--signal);padding-bottom:1px}
.links a:hover{color:var(--signal)}
.modules{display:flex;flex-direction:column;border-top:1px solid var(--rule);align-self:start;width:100%}
.modules div{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:13px 0;border-bottom:1px solid var(--rule)}
.modules b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--signal);padding-top:3px}
.modules span{font-weight:500;font-size:calc(15px * var(--sz-text))}
.modules small{display:block;color:var(--steel);font-weight:400;font-size:13.5px}
@media (max-width:860px){.projects{grid-template-columns:1fr}.proj.feature{grid-template-columns:1fr;padding:26px}}

/* SKILLS */
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.skill{min-width:0;display:flex;flex-direction:column;gap:12px}
.skill h3{font-size:calc(18px * var(--sz-card));font-weight:650;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.skill ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.skill li{font-size:calc(15px * var(--sz-text));color:#36404d}
.creds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:48px}
.cred{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cred .mono{color:var(--signal);font-size:10.5px}
.cred h4{font-family:var(--f-body);font-stretch:100%;letter-spacing:0;font-size:calc(15.5px * var(--sz-text));font-weight:600;line-height:1.35}
.cred p{margin:0;font-size:calc(13.5px * var(--sz-text));color:var(--steel)}
@media (max-width:980px){.skills,.creds{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.skills,.creds{grid-template-columns:1fr}}

/* CONTACT */
.contact{background:var(--ink);color:#fff;padding-block:84px}
.contact .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.contact .mono{color:#ff8a82}
.contact h2{font-size:calc(clamp(30px,3.6vw,44px) * var(--sz-sec));font-weight:700;line-height:1.1;margin-top:10px}
.contact p{color:#c3cad3;max-width:46ch;margin:16px 0 0;font-size:calc(17px * var(--sz-text))}
.clines{display:flex;flex-direction:column;border-top:1px solid #3a4553}
.cline{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid #3a4553}
.cline .mono{color:#9aa4b1}
.cline a,.cline .v{font-size:calc(16.5px * var(--sz-text));font-weight:500;text-decoration:none;overflow-wrap:anywhere;color:#fff}
.cline a:hover{color:#ff8a82}
.copy{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:transparent;color:#fff;border:1px solid #5a6676;padding:6px 10px;cursor:pointer;border-radius:4px}
.copy:hover{border-color:#fff}
@media (max-width:860px){.contact .grid{grid-template-columns:1fr;gap:32px}}
@media (max-width:480px){.cline{grid-template-columns:1fr auto}.cline .mono{grid-column:1/-1}}

footer{background:var(--ink);color:#9aa4b1;border-top:1px solid #3a4553}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px}
footer a{text-decoration:none}
footer .mono{color:#9aa4b1}

.roles{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.roles span{font-size:13.5px;font-weight:500;padding:6px 12px;border:1px solid #4a5666;border-radius:999px;color:#e6eaef}
/* LAYERED CONTACT: page slides up to uncover it */
body{background:var(--ink)}
.page{position:relative;z-index:2;background:var(--paper);border-radius:0 0 28px 28px;overflow:hidden;box-shadow:0 34px 60px -24px rgba(0,0,0,.55)}
.page > section:last-child{border-bottom:0}
.reveal{position:relative;z-index:1}
.reveal.fixed{position:fixed;left:0;right:0;bottom:0}
.reveal .contact{padding-top:110px}
@media (max-width:860px){.reveal .contact{padding-block:48px 28px}.reveal .contact h2{margin-top:6px}.reveal .contact p{margin-top:10px}.cline{padding:12px 0}.page{border-radius:0 0 20px 20px}}
.reveal .contact .grid{transition:transform .2s linear,opacity .2s linear}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<nav class="top" aria-label="Main">
  <div class="wrap">
    <a href="#top" class="brand"><b data-initials></b><span data-name-short></span></a>
    <ul class="navlinks">
      <li><a href="#about">About</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#skills">Skills</a></li>
    </ul>
    <a class="navcta" href="#contact">Contact</a>
  </div>
</nav>

<main class="page" id="page">
<header class="hero" id="top">
  <div class="wrap">
    <div class="hero-copy">
      <span class="badge"><i></i><span data-status></span></span>
      <h1 data-name></h1>
      <p class="role" data-title></p>
      <p class="focus"><span data-focus-label></span> <span id="swap"></span></p>
      <p class="lede" data-intro></p>
      <div class="ctas" id="ctas"></div>
      <div class="meta" id="meta"></div>
    </div>
    <figure class="drawing" style="margin:0">
      <div class="canvas-box">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <canvas id="hero-canvas" aria-label="Animated technical drawing: pump impeller, control chart and gear"></canvas>
      </div>
      <div class="hint">Move your cursor over the drawing</div>
      <figcaption class="titleblock">
        <div><small>Title</small><b id="fig-title">Centrifugal impeller</b></div>
        <div><small>Drawing no.</small><b id="fig-no">KS-001</b></div>
        <div><small>Sheet</small><b id="fig-sheet">1 of 3</b></div>
      </figcaption>
    </figure>
  </div>
  <div class="stats-band"><div class="wrap stats" id="stats"></div></div>
</header>

<section class="block" id="about">
  <div class="wrap">
    <div class="sec-head"><span class="mono">01 · Profile</span><h2>About me</h2></div>
    <div class="sec-body about-wrap">
      <div><div class="portrait" id="portrait"></div></div>
      <div class="about-copy" id="about-copy"></div>
    </div>
  </div>
</section>

<section class="block alt" id="experience">
  <div class="wrap">
    <div class="sec-head"><span class="mono">02 · Career</span><h2>Experience &amp; education</h2></div>
    <ol class="timeline" id="career"></ol>
  </div>
</section>

<section class="block" id="projects">
  <div class="wrap">
    <div class="sec-head"><span class="mono">03 · Work</span><h2>Selected projects</h2></div>
    <div class="projects" id="project-grid"></div>
  </div>
</section>

<section class="block alt" id="skills">
  <div class="wrap">
    <div class="sec-head"><span class="mono">04 · Toolkit</span><h2>Skills &amp; credentials</h2></div>
    <div class="skills" id="skill-grid"></div>
    <div class="creds" id="creds"></div>
  </div>
</section>

</main>

<!-- contact layer: sits behind the page and is uncovered as you scroll to the end -->
<div class="reveal" id="reveal">
<section class="contact" id="contact">
  <div class="wrap grid">
    <div>
      <span class="mono">05 · Contact</span>
      <h2 data-contact-heading></h2>

<script>
/* ---------- builds the page from content.js (no need to edit this) ---------- */
(() => {
  const D = window.SITE;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const $ = s => document.querySelector(s);
  const set = (sel, html) => document.querySelectorAll(sel).forEach(el => el.innerHTML = html);
  const icon = {
    pin:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    mail:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    phone:'<svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>'
  };

  // font sizes
  const map = {headline:'head','section-titles':'sec','card-titles':'card',numbers:'num',text:'text'};
  Object.entries(D.fontSizes || {}).forEach(([k, v]) => {
    const n = parseFloat(v); if (map[k] && n > 0) document.documentElement.style.setProperty('--sz-' + map[k], n);
  });

  const ini = D.initials || 'KS';
  set('[data-initials]', `${esc(ini.slice(0,1))}<span>${esc(ini.slice(1))}</span>`);
  set('[data-name-short]', esc(D.name.split(' ')[0] + ' ' + D.name.split(' ').slice(-1)));
  set('[data-status]', esc(D.status));
  set('[data-name]', esc(D.name));
  set('[data-title]', esc(D.title || ''));
  set('[data-focus-label]', esc(D.hero.headline || 'Focused on'));
  set('[data-intro]', rich(D.hero.intro));
  set('[data-contact-heading]', esc(D.contact.heading));
  set('[data-contact-text]', esc(D.contact.text));
  $('#roles').innerHTML = (D.contact.roles || []).map(r => `<span>${esc(r)}</span>`).join('');
  $('#swap').textContent = (D.hero.rotatingWords || [])[0] || '';

  const ctas = [`<a class="btn primary" href="#projects">View projects</a>`];
  if (D.cvFile) ctas.push(`<a class="btn" href="${esc(D.cvFile)}" target="_blank" rel="noopener">Download CV (PDF)</a>`);
  if (D.linkedin) ctas.push(`<a class="btn ghost" href="${esc(D.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`);
  $('#ctas').innerHTML = ctas.join('');
  const meta = [];
  if (D.location) meta.push(`<span>${icon.pin}${esc(D.location)}</span>`);
  if (D.email) meta.push(`<span>${icon.mail}${esc(D.email)}</span>`);
  if (D.phone) meta.push(`<span>${icon.phone}${esc(D.phone)}</span>`);
  $('#meta').innerHTML = meta.join('');

  $('#stats').innerHTML = D.hero.stats.map(s =>
    `<div class="stat"><div class="n">${esc(s.value)}<em>${esc(s.unit)}</em></div><p>${esc(s.text)}</p></div>`).join('');

  $('#portrait').innerHTML = D.photo
    ? `<img src="${esc(D.photo)}" alt="Portrait of ${esc(D.name)}">`
    : `<div class="mark">${esc(ini.slice(0,1))}<span>${esc(ini.slice(1))}</span></div>`;

  $('#about-copy').innerHTML = D.about.paragraphs.map(p => `<p>${rich(p)}</p>`).join('') +
    `<div class="facts">${D.about.facts.map(f => `<div class="fact"><span class="mono">${esc(f.label)}</span><span>${esc(f.value)}</span></div>`).join('')}</div>`;

  // newest first, like a CV
  const jobs = D.career.filter(c => String(c.when).trim().toLowerCase() !== 'now').reverse();
  $('#career').innerHTML = jobs.map((c, i) =>
    `<li class="job${i === 0 ? ' current' : ''}"><div class="when">${esc(c.when)}</div><div><h3>${esc(c.title)}</h3><div class="org">${esc(c.org)}</div><p>${esc(c.text)}</p></div></li>`).join('');

  const pill = s => s === 'live' ? '<span class="pill live">● Live</span>'
    : s === 'progress' ? '<span class="pill wip">In progress</span>'
    : s ? `<span class="pill">${esc(s)}</span>` : '';
  const link = l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`;
  $('#project-grid').innerHTML = D.projects.map(p => {
    const tags = p.tags?.length ? `<div class="tags">${p.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : '';
    const links = p.links?.length ? `<div class="links">${p.links.map(link).join('')}</div>` : '';
    const head = `<div class="top"><span class="mono">${esc(p.kind)}</span>${pill(p.status)}</div><h3>${esc(p.title)}</h3><p>${rich(p.text)}</p>`;
    if (p.featured) {
      const mods = (p.modules || []).map((m, i) => `<div><b>M${i + 1}</b><span>${esc(m.name)}<small>${esc(m.detail)}</small></span></div>`).join('');
      return `<article class="proj feature"><div class="main">${head}${tags}${links}</div>${mods ? `<div class="modules">${mods}</div>` : ''}</article>`;
    }
    return `<article class="proj">${head}${tags}${links}</article>`;
  }).join('');

  $('#skill-grid').innerHTML = D.skills.map(s =>
    `<div class="skill"><h3>${esc(s.title)}</h3><ul>${s.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
  $('#creds').innerHTML = D.credentials.map(c =>
    `<div class="cred"><span class="mono">${esc(c.tag)}</span><h4>${esc(c.title)}</h4><p>${esc(c.text)}</p></div>`).join('');

  const lines = [];
  if (D.email) lines.push(`<div class="cline"><span class="mono">Email</span><span class="v" id="email">${esc(D.email)}</span><button class="copy" type="button" data-copy="email">Copy</button></div>`);
  if (D.phone) lines.push(`<div class="cline"><span class="mono">Phone</span><span class="v" id="phone">${esc(D.phone)}</span><button class="copy" type="button" data-copy="phone">Copy</button></div>`);
  if (D.linkedin) lines.push(`<div class="cline"><span class="mono">LinkedIn</span><a href="${esc(D.linkedin)}" target="_blank" rel="noopener">${esc(D.linkedin.replace(/^https?:\/\/(www\.)?/, ''))}</a><span></span></div>`);
  if (D.github) lines.push(`<div class="cline"><span class="mono">GitHub</span><a href="${esc(D.github)}" target="_blank" rel="noopener">${esc(D.github.replace(/^https?:\/\//, ''))}</a><span></span></div>`);
  if (D.cvFile) lines.push(`<div class="cline"><span class="mono">CV</span><a href="${esc(D.cvFile)}" target="_blank" rel="noopener">Download PDF ↗</a><span></span></div>`);
  $('#clines').innerHTML = lines.join('');
  $('#copyright').textContent = `© ${new Date().getFullYear()} ${D.name}`;

  document.querySelectorAll('[data-copy]').forEach(btn => btn.addEventListener('click', () => {
    const el = document.getElementById(btn.dataset.copy), txt = el.textContent.trim();
    const done = t => { btn.textContent = t; setTimeout(() => btn.textContent = 'Copy', 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done('Selected'); };
    try { navigator.clipboard.writeText(txt).then(() => done('Copied'), fallback); } catch (e) { fallback(); }
  }));
})();
</script>

<script>
/* ---------- contact layer behind the page ---------- */
(() => {
  const page = document.getElementById('page'), rev = document.getElementById('reveal');
  const inner = rev.querySelector('.contact .grid');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fit(){
    const h = rev.offsetHeight;
    const ok = h < innerHeight * 0.92;           // only layer it if it fits on screen
    rev.classList.toggle('fixed', ok);
    page.style.marginBottom = ok ? h + 'px' : '0px';
    onScroll();
  }
  function onScroll(){
    if (reduce || !rev.classList.contains('fixed')) { inner.style.transform = ''; inner.style.opacity = ''; return; }
    const left = document.documentElement.scrollHeight - innerHeight - scrollY;   // px until fully uncovered
    const p = Math.max(0, Math.min(1, 1 - left / rev.offsetHeight));
    inner.style.transform = `translateY(${(1 - p) * 60}px)`;
    inner.style.opacity = (0.35 + p * 0.65).toFixed(3);
  }
  addEventListener('resize', fit); addEventListener('scroll', onScroll, {passive:true});
  addEventListener('load', fit); document.fonts && document.fonts.ready.then(fit); fit();
  // links to #contact scroll to the very end so the layer is fully uncovered
  document.querySelectorAll('a[href="#contact"]').forEach(a => a.addEventListener('click', e => {
    if (!rev.classList.contains('fixed')) return;
    e.preventDefault(); scrollTo({top: document.documentElement.scrollHeight, behavior: reduce ? 'auto' : 'smooth'});
  }));
})();
</script>

<script>
/* ---------- animated technical drawing ---------- */
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('hero-canvas');
  const ctx = canvas.getContext('2d');
  const swapEl = document.getElementById('swap');
  const RW = (window.SITE && window.SITE.hero.rotatingWords) || [];
  const S = 400;

  function impeller(c){
    c.strokeStyle = c.fillStyle = '#000'; c.lineCap = 'round';
    c.lineWidth = 6; c.beginPath(); c.arc(200,200,180,0,Math.PI*2); c.stroke();
    c.lineWidth = 3; c.beginPath(); c.arc(200,200,62,0,Math.PI*2); c.stroke();
    c.beginPath(); c.arc(200,200,36,0,Math.PI*2); c.fill();
    c.globalCompositeOperation='destination-out'; c.beginPath(); c.arc(200,200,15,0,Math.PI*2); c.fill();
    c.globalCompositeOperation='source-over';
    for (let b=0;b<7;b++){ const base=b*Math.PI*2/7; c.lineWidth=10; c.beginPath();
      for (let t=0;t<=1.0001;t+=0.02){ const r=48+130*t, th=base+1.25*t, x=200+r*Math.cos(th), y=200+r*Math.sin(th); t===0?c.moveTo(x,y):c.lineTo(x,y); }
      c.stroke(); }
  }
  function controlChart(c){
    c.strokeStyle = c.fillStyle = '#000';
    c.lineWidth = 4; c.beginPath(); c.moveTo(30,40); c.lineTo(30,360); c.lineTo(380,360); c.stroke();
    c.setLineDash([12,10]); c.lineWidth = 3;
    [95,285].forEach(y=>{c.beginPath();c.moveTo(30,y);c.lineTo(380,y);c.stroke();});
    c.setLineDash([]); c.lineWidth = 2; c.beginPath(); c.moveTo(30,190); c.lineTo(380,190); c.stroke();
    const ys=[200,170,215,182,240,160,205,225,150,198,62,210,176,230,188,168,214,196];
    c.lineWidth = 4; c.beginPath(); ys.forEach((y,i)=>{const x=50+i*18.5; i?c.lineTo(x,y):c.moveTo(x,y);}); c.stroke();
    ys.forEach((y,i)=>{const x=50+i*18.5; c.beginPath(); c.arc(x,y,i===10?13:7,0,Math.PI*2); c.fill();});
  }
  function gear(c){
    c.fillStyle='#000'; const teeth=16, ro=180, ri=152; c.beginPath();
    for (let i=0;i<teeth;i++){ const a=i*Math.PI*2/teeth, w=Math.PI*2/teeth;
      [[ri,a],[ro,a+w*0.18],[ro,a+w*0.5],[ri,a+w*0.68]].forEach(([r,t],k)=>{const x=200+r*Math.cos(t),y=200+r*Math.sin(t);(i===0&&k===0)?c.moveTo(x,y):c.lineTo(x,y);}); }
    c.closePath(); c.fill();
    c.globalCompositeOperation='destination-out';
    c.beginPath(); c.arc(200,200,48,0,Math.PI*2); c.fill();
    for (let i=0;i<6;i++){ const a=i*Math.PI/3; c.beginPath(); c.arc(200+102*Math.cos(a),200+102*Math.sin(a),26,0,Math.PI*2); c.fill(); }
    c.fillRect(190,140,20,14); c.globalCompositeOperation='source-over';
  }
  const shapes = [
    {draw:impeller, title:'Centrifugal impeller', no:'KS-001', spin:0.003},
    {draw:controlChart, title:'X̄ control chart', no:'KS-002', spin:0},
    {draw:gear, title:'Spur gear, 16 teeth', no:'KS-003', spin:-0.002},
  ];
  const N = innerWidth < 700 ? 1100 : 1800;
  function sample(draw){
    const off=document.createElement('canvas'); off.width=off.height=S; const c=off.getContext('2d'); draw(c);
    const d=c.getImageData(0,0,S,S).data, pts=[];
    for (let y=0;y<S;y+=2) for (let x=0;x<S;x+=2) if (d[(y*S+x)*4+3]>120) pts.push([x/S-.5,y/S-.5]);
    for (let i=pts.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pts[i],pts[j]]=[pts[j],pts[i]];}
    return Array.from({length:N},(_,i)=>pts[i%pts.length]);
  }
  shapes.forEach(s=>s.pts=sample(s.draw));

  let W=0,H=0,scale=1;
  function resize(){ const r=canvas.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
    W=r.width; H=r.height; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); scale=Math.min(W,H)*0.84; }
  resize(); addEventListener('resize',resize);

  const P = Array.from({length:N},()=>({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,s:Math.random()<.1?2.4:1.5,red:Math.random()<.09}));
  let cur=0, angle=0, wordIdx=0; const mouse={x:-9999,y:-9999};
  canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;});
  canvas.addEventListener('pointerleave',()=>{mouse.x=mouse.y=-9999;});

  function setShape(i){
    cur=i; angle=0;
    swapEl.classList.add('out');
    setTimeout(()=>{ wordIdx=(wordIdx+1)%Math.max(RW.length,1); swapEl.textContent = RW.length ? RW[wordIdx] : '';
      document.getElementById('fig-title').textContent = shapes[i].title;
      document.getElementById('fig-no').textContent = shapes[i].no;
      document.getElementById('fig-sheet').textContent = (i+1)+' of '+shapes.length;
      swapEl.classList.remove('out'); }, 350);
    P.forEach(p=>{p.vx+=(Math.random()-.5)*5; p.vy+=(Math.random()-.5)*5;});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for (const red of [false,true]){
      ctx.fillStyle = red ? 'rgba(200,38,29,.95)' : 'rgba(28,36,48,.78)';
      for (const p of P) if (p.red===red) ctx.fillRect(p.x,p.y,p.s,p.s);
    }
  }
  function frame(){
    const sh=shapes[cur]; angle+=sh.spin; const cs=Math.cos(angle), sn=Math.sin(angle), cx=W/2, cy=H/2;
    for (let i=0;i<N;i++){ const p=P[i], h=sh.pts[i];
      const tx=cx+(h[0]*cs-h[1]*sn)*scale, ty=cy+(h[0]*sn+h[1]*cs)*scale;
      p.vx+=(tx-p.x)*0.02; p.vy+=(ty-p.y)*0.02;
      const dx=p.x-mouse.x, dy=p.y-mouse.y, d2=dx*dx+dy*dy;
      if (d2<6400){ const f=(6400-d2)/6400*2.2, d=Math.sqrt(d2)||1; p.vx+=dx/d*f; p.vy+=dy/d*f; }
      p.vx*=0.85; p.vy*=0.85; p.x+=p.vx; p.y+=p.vy; }
    draw(); requestAnimationFrame(frame);
  }
  if (reduce){ const sh=shapes[0]; P.forEach((p,i)=>{p.x=W/2+sh.pts[i][0]*scale; p.y=H/2+sh.pts[i][1]*scale;}); draw(); }
  else { requestAnimationFrame(frame); setInterval(()=>{ if(!document.hidden) setShape((cur+1)%shapes.length); }, 6000); }
})();
</script>
